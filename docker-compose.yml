services:
  postgres:
    container_name: forever-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forever}
      POSTGRES_USER: ${POSTGRES_USER:-forever}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forever}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forever} -d ${POSTGRES_DB:-forever}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:
        aliases:
          - forever-postgres

  backend:
    container_name: forever-backend
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-forever}
      DB_USER: ${POSTGRES_USER:-forever}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-forever}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:${BACKEND_BIND_PORT:-19000}:8000"
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w ${GUNICORN_WORKERS:-4}
      --timeout ${GUNICORN_TIMEOUT:-60}
      -b 0.0.0.0:8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - backend
          - forever-backend

  frontend-builder:
    container_name: forever-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-demo.etalonfood.com:9000}
    volumes:
      - ./deploy/frontend:/out
    restart: "no"
    networks:
      default:
        aliases:
          - forever-frontend

  admin-builder:
    container_name: forever-admin-panel
    build:
      context: ./admin-panel
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-demo.etalonfood.com:9000}
    volumes:
      - ./deploy/admin:/out
    restart: "no"
    networks:
      default:
        aliases:
          - forever-admin-panel

volumes:
  postgres_data:
