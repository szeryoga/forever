services:
  postgres:
    container_name: forever-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forever}
      POSTGRES_USER: ${POSTGRES_USER:-forever}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forever}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forever} -d ${POSTGRES_DB:-forever}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    container_name: forever-backend
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-forever}
      DB_USER: ${POSTGRES_USER:-forever}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-forever}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
    expose:
      - "8000"
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w ${GUNICORN_WORKERS:-4}
      --timeout ${GUNICORN_TIMEOUT:-60}
      -b 0.0.0.0:8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend-builder:
    container_name: forever-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api-demo.etalonfood.com:9000}
    volumes:
      - frontend_dist:/out
    restart: "no"

  admin-builder:
    container_name: forever-admin-panel
    build:
      context: ./admin-panel
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api-demo.etalonfood.com:9000}
    volumes:
      - admin_dist:/out
    restart: "no"

  nginx:
    container_name: forever-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend-builder:
        condition: service_completed_successfully
      admin-builder:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-9091}:9091"
      - "${ADMIN_PORT:-9092}:9092"
      - "${API_PORT:-9000}:9000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/var/www/frontend:ro
      - admin_dist:/var/www/admin:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9091/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_dist:
  admin_dist:
