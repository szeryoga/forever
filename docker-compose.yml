services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w ${GUNICORN_WORKERS}
      --timeout ${GUNICORN_TIMEOUT}
      -b 0.0.0.0:8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      default:
      gateway:
        aliases:
          - forever-backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${API_BASE_PATH}
        VITE_APP_BASE: ${APP_BASE_PATH}/
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
      gateway:
        aliases:
          - forever-frontend

  admin-panel:
    build:
      context: ./admin-panel
      args:
        VITE_API_BASE: ${API_BASE_PATH}
        VITE_ADMIN_BASE: ${ADMIN_BASE_PATH}/
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
      gateway:
        aliases:
          - forever-admin

volumes:
  postgres_data:

networks:
  gateway:
    name: ${GATEWAY_NETWORK:-gateway-net}
    external: true
